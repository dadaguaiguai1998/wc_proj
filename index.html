<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple</title>
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/main.js"></script>
  </head>

  <body>
    <header>
      <nav>
        <a class="nav-logo">🍎</a>
        <ul>
          <li><a class="nav-link">Mac</a></li>
          <li><a class="nav-link">iPad</a></li>
          <li><a class="nav-link">iPhone</a></li>
          <li><a class="nav-link">Watch</a></li>
          <li><a class="nav-link">TV</a></li>
          <li><a class="nav-link">Music</a></li>
          <li><a class="nav-link">技术支持</a></li>
        </ul>
        <a class="nav-icon">🔍</a>
        <a class="nav-icon">🛒</a>
      </nav>
    </header>
    <main>
      <section class="hero">
        <video
          class="hero-background"
          autoplay
          muted
          loop
          playsinline
          poster="hero-poster.jpg"
        >
          <source src="hero-video.mp4" type="video/mp4" />
          <source src="hero-video.webm" type="video/webm" />
        </video>
        <div class="hero-content">
          <h2 class="hero-title">iPhone 15 Pro</h2>
          <p class="hero-subtitle">钛金属，轻盈登场</p>
          <div class="hero-cta">
            <a class="hero-link">进一步了解</a>
            <a class="hero-link">购买</a>
          </div>
        </div>
      </section>

      <section class="products">
        <!-- 产品卡片1 -->
        <article class="product-card">
          <figure class="product-image">
            <picture>
              <source
                media="(min-width: 1200px)"
                srcset="iphone-pro-large.jpg"
              />
              <source
                media="(min-width: 768px)"
                srcset="iphone-pro-medium.jpg"
              />
              <img
                src="iphone-pro-small.jpg"
                alt="iPhone 15 Pro 展示图"
                loading="eager"
              />
            </picture>
            <figcaption>iPhone 15 Pro</figcaption>
          </figure>
          <div class="product-info">
            <h3 class="product-title">iPhone 15 Pro</h3>
            <p class="product-description">A17 Pro芯片，钛金属边框。</p>
            <div class="product-link">
              <a href="#">进一步了解</a>
              <a href="#">购买</a>
            </div>
          </div>
        </article>

        <!-- 产品卡片2 -->
        <article class="product-card">
          <figure class="product-image">
            <picture>
              <source
                media="(min-width: 1200px)"
                srcset="macbook-pro-large.jpg"
              />
              <source
                media="(min-width: 768px)"
                srcset="macbook-pro-medium.jpg"
              />
              <img
                src="macbook-pro-small.jpg"
                alt="MacBook Pro 展示图"
                loading="lazy"
              />
            </picture>
            <figcaption>MacBook Pro</figcaption>
          </figure>
          <div class="product-info">
            <h3 class="product-title">MacBook Pro</h3>
            <p class="product-description">M3 Pro芯片，性能狂飙。</p>
            <div class="product-link">
              <a href="#">进一步了解</a>
              <a href="#">购买</a>
            </div>
          </div>
        </article>
      </section>
    </main>
    <footer>
      <p class="footer-copyright">Copyright © 2024 Apple Inc.</p>
    </footer>
  </body>
</html>
