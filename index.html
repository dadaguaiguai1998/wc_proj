<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>仿苹果风格导航栏 | 毛玻璃效果</title>
    <!-- Font Awesome 6 (免费图标库，用于苹果logo、搜索和购物袋图标) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- 仿苹果毛玻璃导航栏 (固定顶部) -->
    <header class="apple-navbar"></header>

    <!-- 主要内容区域，滚动时透过导航栏毛玻璃可见其下内容 -->
    <main>
      <ul class="video-grid" id="videoListContainer">
        <li class="video-card">
          <div class="card-cover">
            <img
              src="https://picsum.photos/id/20/400/225"
              alt="视频封面"
              loading="lazy"
            />
            <div class="card-meta">03:25</div>
          </div>
          <div class="card-info">
            <div class="video-title">
              【4K】探索未知边界：AI 如何重塑前端开发体验
            </div>
            <div class="video-author">
              <span class="avatar-placeholder"></span>
              <span class="author-name">科技猿星球</span>
            </div>
            <div class="video-stats">
              <span>🔴 12.8万播放</span>
              <span>💬 3456条弹幕</span>
            </div>
          </div>
        </li>
      </ul>
    </main>
    <div
      id="load-more-sentinel"
      style="height: 20px; margin: 20px 0; text-align: center; color: #aaa"
    >
      —— 加载中 ——
    </div>
    <script type="text/javascript" src="js/main.js"></script>

    <!-- 无需额外JavaScript，纯CSS交互（focus/hover），毛玻璃完美呈现 -->
  </body>
</html>
